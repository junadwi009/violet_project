name: violet

services:
  assistant-core:
    build:
      context: .
      dockerfile: services/assistant-core/Dockerfile
    image: violet-assistant-core
    environment:
      # Mock is the safe, offline default. To use a local model, set:
      #   LLM_PROVIDER=ollama and LLM_BASE_URL=http://host.docker.internal:11434/v1
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-local-model}
      # Multi-layer routing (passed at runtime from your .env; the key is never baked into the image).
      LLM_ROUTER: ${LLM_ROUTER:-single}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      PERSONA_MODEL: ${PERSONA_MODEL:-nousresearch/hermes-4-70b}
      TECHNICAL_MODEL: ${TECHNICAL_MODEL:-deepseek/deepseek-chat-v3.1}
      ARTIFACT_MODEL: ${ARTIFACT_MODEL:-qwen/qwen3-coder}
      VISION_MODEL: ${VISION_MODEL:-qwen/qwen3-vl-32b-instruct}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-15}
      DATABASE_URL: sqlite:////app/data/violet.db
      # Approved memories are markdown files under MEMORY_DIR, bind-mounted below to a host
      # folder (./memory) so you can manage them directly / sync them to a VPS or Google Drive.
      MEMORY_BACKEND: ${MEMORY_BACKEND:-files}
      MEMORY_DIR: /app/memory
      MEMORY_REQUIRE_APPROVAL: "true"
    volumes:
      - violet-data:/app/data
      - ./memory:/app/memory
      # Persist skills installed at runtime (Skill Lab "Install") to the host repo.
      - ./configs/agents/imported:/app/configs/agents/imported
    ports:
      - "8000:8000" # direct API access + /docs (optional; the web app uses the proxy)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web-client/Dockerfile
    image: violet-web
    depends_on:
      assistant-core:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  violet-data:
