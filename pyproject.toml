[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "violet-project"
version = "0.1.0"
description = "Local-first Violet AI assistant Phase 1 backend."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "python-multipart>=0.0.9",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = [
  "services/assistant-core/src",
  "services/speech-service/src",
  "services/tts-service/src",
]

[tool.pytest.ini_options]
pythonpath = [
  "services/assistant-core/src",
  "services/speech-service/src",
  "services/tts-service/src",
]
testpaths = [
  "services/assistant-core/tests",
  "services/speech-service/tests",
  "services/tts-service/tests",
]
addopts = "--basetemp=.tmp/pytest"
cache_dir = ".tmp/pytest-cache"
