<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Violet AI</title>
    <script>
      // Stamp the cached appearance before the bundle loads, so a dark-theme
      // user does not see a flash of light while /api/settings is in flight.
      // The server value overwrites this as soon as it arrives.
      (function () {
        try {
          var a = JSON.parse(localStorage.getItem("violet.appearance") || "{}");
          var t = a.theme || "system";
          var dark =
            t === "dark" ||
            (t === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.dataset.theme = dark ? "dark" : "light";
          root.dataset.density = a.density || "cozy";
          root.dataset.accent = a.accent || "violet";
          // Clamp, mirroring clampFontScale() in src/lib/theme.ts. This cannot
          // import it — it has to run before the bundle. localStorage never
          // passed through server validation, and an out-of-range value here is
          // not cosmetic: `calc(1rem * NaN)` renders the page at 0px, hiding the
          // very panel needed to undo it. NaN/0/negative -> 0px, 1e400 -> 8000px.
          var fs = Number(a.fontScale);
          if (!isFinite(fs)) fs = 1;
          fs = Math.min(1.25, Math.max(0.875, fs));
          root.style.setProperty("--font-scale", String(fs));
        } catch (e) {
          /* first visit, or storage blocked — defaults apply */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
